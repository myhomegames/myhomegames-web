# Deploy the committed `docs/` tree (Vite outDir) to GitHub Pages.
# Replaces the legacy automatic `pages-build-deployment` workflow so we can
# control job timeout and verify Pages reports `built` after deploy-pages.
#
# Note: actions/deploy-pages hard-caps its own `timeout` input at 10 minutes
# (Pages backend). Job `timeout-minutes: 60` + retries + post-deploy polling
# cover long `deployment_queued` stalls.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      # wretry.action bundles wrapped outputs into a single JSON `outputs` string.
      url: ${{ fromJSON(steps.deployment.outputs.outputs).page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # Retry: each attempt can wait up to 10m on deployment_queued.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/deploy-pages@v4
          with: |
            timeout: 600000
          attempt_limit: 5
          attempt_delay: 30000

      - name: Wait until Pages status is built
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Stay under the 60m job budget (leave room for prior steps).
          MAX_WAIT_SEC=3000
          INTERVAL_SEC=20
          start_ts=$(date +%s)

          echo "Polling GET /repos/${REPO}/pages until status=built (max ${MAX_WAIT_SEC}s)…"
          while true; do
            now_ts=$(date +%s)
            elapsed=$((now_ts - start_ts))
            if [ "${elapsed}" -ge "${MAX_WAIT_SEC}" ]; then
              echo "Timed out after ${elapsed}s waiting for Pages status=built" >&2
              gh api "repos/${REPO}/pages" || true
              exit 1
            fi

            status="$(gh api "repos/${REPO}/pages" --jq '.status // "unknown"')"
            printf '%s Pages status: %s (elapsed %ss)\n' "$(date -u +%H:%M:%S)" "${status}" "${elapsed}"

            case "${status}" in
              built)
                echo "Pages reports built."
                exit 0
                ;;
              errored)
                echo "Pages reports errored" >&2
                gh api "repos/${REPO}/pages" || true
                exit 1
                ;;
            esac

            sleep "${INTERVAL_SEC}"
          done
