<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyHomeGames</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1a1a;
        color: #f5f5f5;
        font-family: "SamsungOne", "Arial", sans-serif;
      }

      .splash {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 2rem;
        text-align: center;
        box-sizing: border-box;
      }

      .brand {
        margin: 0;
        font-size: 2.5rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #e5a00d;
      }

      .status {
        margin: 0;
        font-size: 1.25rem;
        opacity: 0.9;
      }

      .hint {
        margin: 1rem 0 0;
        max-width: 36rem;
        font-size: 1rem;
        opacity: 0.65;
        line-height: 1.4;
      }

      .retry {
        margin-top: 1.5rem;
        padding: 0.75rem 1.5rem;
        font-size: 1.125rem;
        color: #1a1a1a;
        background: #e5a00d;
        border: 0;
        border-radius: 4px;
      }

      .retry:focus {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }

      .pwa-frame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        margin: 0;
        padding: 0;
        background: #000;
        z-index: 1;
      }

      .splash[hidden],
      .pwa-frame[hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main class="splash" id="splash">
      <p class="brand">MyHomeGames</p>
      <p class="status" id="status">Opening library…</p>
      <p class="hint">
        Requires network access to the PWA and your MyHomeGames server.
      </p>
      <button type="button" id="retry" class="retry" hidden>Retry</button>
    </main>
    <!--
      Hosted PWA stays in an iframe so this local document keeps window.tizen.
      Exit from the PWA: postMessage({ type: "mhg-tizen-exit" }).
    -->
    <iframe
      id="pwa"
      class="pwa-frame"
      title="MyHomeGames"
      hidden
      allow="autoplay; fullscreen; gamepad; microphone; camera; encrypted-media; display-capture; clipboard-read; clipboard-write"
      allowfullscreen
    ></iframe>
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
