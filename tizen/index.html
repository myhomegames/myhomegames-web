<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyHomeGames</title>
    <link rel="stylesheet" href="css/splash.css" />
  </head>
  <body>
    <main class="splash" id="splash">
      <p class="brand">MyHomeGames</p>
      <p class="status" id="status">Opening library…</p>
      <p class="hint">
        Requires network access to the PWA and your MyHomeGames server.
      </p>
      <button type="button" id="retry" class="retry" hidden>Retry</button>
    </main>
    <!--
      Hosted PWA stays in an iframe so this local document keeps window.tizen.
      Exit from the PWA: postMessage({ type: "mhg-tizen-exit" }).
    -->
    <iframe
      id="pwa"
      class="pwa-frame"
      title="MyHomeGames"
      hidden
      allow="autoplay; fullscreen; gamepad; microphone; camera; encrypted-media; display-capture; clipboard-read; clipboard-write"
      allowfullscreen
    ></iframe>
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
